<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>NEON DEFENSE</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%230a0a0a'/%3E%3Cpolygon points='16,4 28,28 4,28' fill='none' stroke='%2300ffff' stroke-width='2'/%3E%3Ccircle cx='16' cy='18' r='4' fill='%2300ffff' opacity='0.8'/%3E%3C/svg%3E">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#00ffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NEON DEFENSE">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

/* Game-screen type and text colours. Greys stay at 4.5:1 or more on #0a0a0a. */
:root {
  --font-ui: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-brand: 'Courier New', monospace;
  --text-1: #f0f0f0;
  --text-2: #b8b8c0;
  --text-3: #8c8c96;
}

body {
  background: #0a0a0a;
  color: #e0e0e0;
  font-family: var(--font-ui);
  overflow: hidden;
  user-select: none;
  touch-action: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}

#game-container {
  display: flex;
  width: 100vw;
  height: 100dvh;
  height: 100vh;
  padding-top: env(safe-area-inset-top, 0px);
  background: #0a0a0a;
}

#canvas-wrapper {
  position: relative;
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
}

canvas {
  display: block;
  cursor: crosshair;
  max-width: 100%;
  max-height: 100%;
  touch-action: none;
  border: 1px solid rgba(255, 255, 255, 0.15);
}

/* HUD: row 1 has the counters, row 2 the next-unlock progress and the controls */
#hud {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 8px 16px 6px;
  background: linear-gradient(to bottom, rgba(0,0,0,0.9), rgba(0,0,0,0.6) 70%, transparent);
  pointer-events: none;
  z-index: 10;
}

#ui-overlay {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  justify-items: center;
  font-size: 22px;
}

.hud-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  min-width: 0;
  line-height: 1.15;
}

.hud-main {
  display: flex;
  align-items: center;
  gap: 5px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.hud-label {
  font-size: 12px;
  color: var(--text-2);
}

#hud-gold { color: #ffd700; }
#hud-wave { color: #00ffff; }
#hud-lives { color: #ff5555; }
#hud-score { color: #ffffff; }

/* Inline SVG icons (js/icons.js) */
.icon {
  width: 1em;
  height: 1em;
  flex-shrink: 0;
  vertical-align: -0.15em;
  margin-right: 0.25em;
}

/* The glow sits on the icon so the digits stay sharp */
.hud-item .icon { width: 0.9em; height: 0.9em; margin-right: 0; filter: drop-shadow(0 0 4px currentColor); }
.hud-total { color: var(--text-2); font-size: max(12px, 0.65em); font-weight: 600; }

#hud-row2 {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

/* Unlock Tracker */
#unlock-tracker {
  flex: 1;
  min-width: 0;
  max-width: 260px;
  font-size: 13px;
  line-height: 1.25;
  pointer-events: none;
}

#unlock-tracker.hidden { display: block !important; visibility: hidden; }

#unlock-tracker .unlock-label {
  color: var(--text-1);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

#unlock-tracker .unlock-togo {
  color: var(--text-2);
  margin-bottom: 4px;
}

#unlock-tracker .unlock-bar-bg {
  width: 100%;
  height: 5px;
  background: rgba(255, 255, 255, 0.12);
  border-radius: 3px;
  overflow: hidden;
}

#unlock-tracker .unlock-bar-fill {
  height: 100%;
  border-radius: 3px;
  transition: width 0.4s ease-out;
  box-shadow: 0 0 6px currentColor;
}

/* Speed, pause and sound */
#speed-controls {
  display: flex;
  gap: 4px;
  pointer-events: auto;
}

.speed-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 44px;
  height: 44px;
  padding: 0 12px;
  background: rgba(20, 20, 20, 0.85);
  color: var(--text-1);
  border: 1px solid #555;
  font-family: var(--font-ui);
  font-size: 15px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  cursor: pointer;
  transition: all 0.2s;
}

.speed-btn .icon { width: 20px; height: 20px; margin: 0; }
.speed-btn:hover { border-color: #888; }
.speed-btn.active {
  color: #00ffff;
  border-color: #00ffff;
  box-shadow: 0 0 8px rgba(0, 255, 255, 0.3);
}

/* Tower Panel */
#tower-panel {
  width: 200px;
  background: #0d0d0d;
  border-left: 1px solid #1a1a2e;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  overflow-y: auto;
  transition: opacity 0.3s ease;
}

#tower-panel.panel-hidden {
  opacity: 0;
  pointer-events: none;
}

/* Heading and mid-wave note share one row, so the panel height never changes */
#panel-head {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  justify-content: center;
  column-gap: 12px;
  margin-bottom: 4px;
}

#tower-panel h3 {
  color: #00ffff;
  font-size: 18px;
  text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
}

.tower-btn {
  background: rgba(20, 20, 30, 0.8);
  border: 1px solid var(--tower-color, #333);
  padding: 8px;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  gap: 8px;
}

.tower-btn .tower-pic {
  width: 40px;
  height: 40px;
  flex-shrink: 0;
}

.tower-btn .tower-text {
  display: flex;
  flex-direction: column;
  gap: 3px;
  min-width: 0;
}

.tower-btn.tower-locked .tower-pic {
  filter: grayscale(1) brightness(0.45);
}

.tower-pic-wrap {
  position: relative;
  display: flex;
  flex-shrink: 0;
}

.tower-pic-wrap .icon {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 55%;
  height: 55%;
  margin: 0;
  transform: translate(-50%, -50%);
  color: #ff8800;
  filter: drop-shadow(0 0 2px #000);
}

.tower-btn .tower-need {
  font-family: var(--font-ui);
  font-size: 12px;
  color: #ff8866;
}

.tower-btn .tower-need:empty { display: none; }

.tower-btn:hover {
  box-shadow: 0 0 12px var(--tower-color, #333);
  background: rgba(30, 30, 50, 0.8);
}

.tower-btn.selected {
  background: rgba(255, 255, 255, 0.1);
  box-shadow: 0 0 16px var(--tower-color, #333), 0 0 30px var(--tower-color, #333), inset 0 0 12px rgba(255,255,255,0.08);
}

.tower-btn .tower-name {
  font-family: var(--font-ui);
  font-size: 15px;
  color: var(--tower-color, #ccc);
  font-weight: bold;
}

.tower-btn .tower-cost {
  font-family: var(--font-ui);
  font-size: 14px;
  color: #ffd700;
}

.tower-btn .tower-desc {
  font-family: var(--font-ui);
  font-size: 13px;
  color: var(--text-3);
}

/* Unaffordable towers: the picture fades, the text stays readable and "Need N more" says why */
.tower-btn.tower-unaffordable { border-color: #555; }
.tower-btn.tower-unaffordable .tower-pic { opacity: 0.45; }

/* Locked towers */
.tower-btn.tower-locked {
  border-color: #333;
}

.tower-btn .locked-name {
  color: var(--text-3) !important;
}

.tower-btn .tower-unlock-req {
  font-family: var(--font-ui);
  font-size: 12px;
  color: #ff8800;
}

#unlock-notification {
  position: absolute;
  top: 35%;
  left: 50%;
  transform: translateX(-50%) translateY(-10px);
  background: rgba(0, 10, 20, 0.95);
  border: 1px solid #00ff66;
  box-shadow: 0 0 30px rgba(0, 255, 100, 0.4), 0 0 60px rgba(0, 255, 100, 0.15);
  padding: 20px 36px;
  z-index: 90;
  text-align: center;
  font-family: var(--font-ui);
  opacity: 0;
  transition: opacity 0.5s, transform 0.5s;
  pointer-events: none;
}

#unlock-notification.unlock-visible {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

#unlock-notification .unlock-title {
  font-size: 18px;
  color: #00ff66;
  text-shadow: 0 0 15px rgba(0, 255, 100, 0.6);
  margin-bottom: 8px;
}

#unlock-notification .unlock-names {
  font-size: 16px;
  font-weight: bold;
}

/* Upgrade Panel */
#upgrade-panel {
  position: absolute;
  background: #0a0a0f;
  border: 1px solid #333;
  padding: 12px;
  z-index: 20;
  min-width: 300px;
  display: none;
  font-family: var(--font-ui);
}

#upgrade-panel .up-title { font-weight: bold; margin-bottom: 4px; font-size: 16px; padding-right: 36px; }
#upgrade-panel .up-close {
  position: absolute; top: 2px; right: 2px;
  width: 44px; height: 44px;
  background: none; border: none;
  color: var(--text-2); font-size: 26px; line-height: 1;
  cursor: pointer;
}
#upgrade-panel .up-close:hover { color: var(--text-1); }
#upgrade-panel .up-stats {
  display: flex; gap: 10px; flex-wrap: wrap;
  font-size: 13px; color: var(--text-2); padding: 4px 0 6px;
  border-bottom: 1px solid #1a1a2e; margin-bottom: 4px;
}
#upgrade-panel .up-stats span { white-space: nowrap; }
#upgrade-panel .up-path-name { margin-top: 6px; color: var(--text-1); font-size: 14px; font-weight: 600; }
#upgrade-panel .up-path-locked { color: #ff8866; font-size: 12px; margin: 2px 0; }
#upgrade-panel .up-cost .icon { color: inherit; }
#upgrade-panel .up-level {
  display: flex; align-items: center; gap: 8px;
  padding: 4px 6px; margin: 2px 0; border: 1px solid transparent; border-radius: 2px;
}
#upgrade-panel .up-cost { font-size: 14px; font-weight: bold; min-width: 44px; }
#upgrade-panel .up-info { display: flex; flex-direction: column; gap: 1px; }
#upgrade-panel .up-desc { font-size: 13px; }
#upgrade-panel .up-changes { font-size: 12px; color: var(--text-3); }
#upgrade-panel .up-need { font-size: 12px; color: #ff8866; }
#upgrade-panel .up-purchased .up-changes { color: #6fcf97; }
#upgrade-panel .up-available .up-changes { color: #66ccff; }
#upgrade-panel .up-check { color: #00ff66; font-size: 15px; min-width: 44px; }
#upgrade-panel .up-purchased .up-desc { color: #00e676; }
#upgrade-panel .up-available {
  cursor: pointer; background: rgba(255, 215, 0, 0.12);
  border: 1px solid rgba(255, 215, 0, 0.5);
  box-shadow: 0 0 10px rgba(255, 215, 0, 0.3), 0 0 20px rgba(255, 215, 0, 0.1), inset 0 0 10px rgba(255, 215, 0, 0.08);
  animation: up-glow 2s ease-in-out infinite;
}
#upgrade-panel .up-available:hover {
  background: rgba(255, 215, 0, 0.22); border-color: rgba(255, 215, 0, 0.7);
  box-shadow: 0 0 16px rgba(255, 215, 0, 0.5), 0 0 30px rgba(255, 215, 0, 0.2), inset 0 0 14px rgba(255, 215, 0, 0.1);
  animation: none;
}
@keyframes up-glow {
  0%, 100% { box-shadow: 0 0 8px rgba(255, 215, 0, 0.2), 0 0 16px rgba(255, 215, 0, 0.08), inset 0 0 8px rgba(255, 215, 0, 0.05); }
  50% { box-shadow: 0 0 14px rgba(255, 215, 0, 0.4), 0 0 28px rgba(255, 215, 0, 0.15), inset 0 0 12px rgba(255, 215, 0, 0.1); }
}
#upgrade-panel .up-available .up-cost { color: #ffd700; }
#upgrade-panel .up-available .up-desc { color: #fff; }
#upgrade-panel .up-unaffordable {
  border: 1px solid rgba(255, 255, 255, 0.12);
  background: rgba(255, 255, 255, 0.02);
}
#upgrade-panel .up-unaffordable .up-cost { color: var(--text-2); }
#upgrade-panel .up-unaffordable .up-desc { color: var(--text-1); }
#upgrade-panel .up-locked .up-cost,
#upgrade-panel .up-locked .up-desc { color: var(--text-3); }
#upgrade-panel .up-actions { margin-top: 8px; display: flex; gap: 12px; }
#upgrade-panel .move-btn { font-size: 14px; color: #33bbff; cursor: pointer; }
#upgrade-panel .sell-btn { font-size: 14px; color: #ff6666; cursor: pointer; }

/* Tower Stats Tooltip */
#tower-stats-tooltip {
  position: absolute;
  background: #0a0a0f;
  border: 1px solid #333;
  padding: 10px 12px;
  z-index: 25;
  min-width: 220px;
  max-width: 280px;
  font-family: var(--font-ui);
  pointer-events: none;
  opacity: 0;
  transform: translateY(4px);
  transition: opacity 150ms ease-out, transform 150ms ease-out;
  visibility: hidden;
}

#tower-stats-tooltip.visible {
  opacity: 1;
  transform: translateY(0);
  visibility: visible;
}

#tower-stats-tooltip .ttp-title { font-weight: bold; font-size: 15px; margin-bottom: 2px; display: flex; align-items: center; gap: 6px; }
#tower-stats-tooltip .ttp-pic { width: 32px; height: 32px; }
#tower-stats-tooltip .ttp-desc { font-size: 13px; color: var(--text-2); margin-bottom: 6px; }
#tower-stats-tooltip .ttp-stats {
  display: flex; gap: 8px; flex-wrap: wrap;
  font-size: 13px; color: var(--text-2);
  padding: 4px 0; border-top: 1px solid #1a1a2e;
}
#tower-stats-tooltip .ttp-stats span { white-space: nowrap; }
.stat .icon { opacity: 0.8; }
#tower-stats-tooltip .ttp-stat-val { font-weight: bold; }
#tower-stats-tooltip .ttp-targeting { font-size: 12px; color: var(--text-3); margin-top: 4px; }
#tower-stats-tooltip .ttp-locked-hint { font-size: 12px; color: #ff8800; margin-top: 6px; }
#tower-stats-tooltip .ttp-place-btn { display: none; }

.tower-btn.previewing {
  background: rgba(255, 255, 255, 0.08);
  box-shadow: 0 0 12px var(--tower-color, #333), inset 0 0 8px rgba(255,255,255,0.05);
}

/* Wave Controls Wrapper */
#wave-controls {
  position: absolute;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  z-index: 10;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
}

#wave-controls.visible {
  opacity: 1;
  pointer-events: auto;
}

/* Wave Preview */
#wave-preview {
  background: rgba(0,0,0,0.7);
  padding: 6px 16px;
  font-size: 16px;
  color: var(--text-2);
  border: 1px solid #333;
}

/* Phase: label above the wave controls, tower list inactive during a wave */
#phase-label {
  white-space: nowrap;
  font-size: 15px;
  font-weight: 600;
  color: #00ffff;
}

#game-container[data-phase="wave"] #phase-label { color: #ff8800; }
#game-container[data-phase="wave"] #wave-preview,
#game-container[data-phase="wave"] #start-wave-btn { display: none; }

#build-note {
  visibility: hidden;
  font-size: 13px;
  font-weight: 600;
  color: #ff8800;
  text-align: center;
}

#game-container[data-phase="wave"] #build-note { visibility: visible; }
#game-container[data-phase="wave"] #tower-list { pointer-events: none; }
#game-container[data-phase="wave"] .tower-btn { background: rgba(10, 10, 14, 0.9); box-shadow: none; }
#game-container[data-phase="wave"] .tower-btn:not(.tower-locked) .tower-pic { filter: grayscale(0.7); }

/* Wave preview enemy pictures */
#wave-preview { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
#wave-preview-content { display: inline-flex; flex-wrap: wrap; align-items: center; }
.wp-enemy { display: inline-flex; align-items: center; gap: 2px; margin-right: 6px; }
.wp-pic { width: 22px; height: 22px; }

/* HUD feedback */
@keyframes hud-hit {
  0%, 100% { transform: translateX(0); }
  15% { transform: translateX(-4px) scale(1.25); color: #fff; }
  30% { transform: translateX(4px) scale(1.25); }
  45% { transform: translateX(-3px) scale(1.15); color: #fff; }
  60% { transform: translateX(3px); }
}
#hud-lives.hud-hit { animation: hud-hit 0.5s ease-out; }

@keyframes hud-pulse {
  0%, 100% { transform: scale(1); }
  40% { transform: scale(1.2); color: #fff6b0; }
}
#hud-gold.hud-pulse { animation: hud-pulse 0.35s ease-out; }

/* Start Wave Button */
#start-wave-btn {
  background: rgba(0, 255, 255, 0.1);
  color: #00ffff;
  border: 1px solid #00ffff;
  padding: 10px 30px;
  font-family: var(--font-ui);
  font-size: 20px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
}

#start-wave-btn:hover:not(:disabled) {
  background: rgba(0, 255, 255, 0.2);
  box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
}

#start-wave-btn:disabled {
  color: var(--text-3);
  border-color: #444;
  background: transparent;
  cursor: default;
}

/* Menu Screen */
#menu-screen {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: #0a0a0a;
  z-index: 100;
}

#menu-screen h1 {
  font-family: var(--font-brand);
  font-size: 72px;
  color: #00ffff;
  letter-spacing: 12px;
  text-shadow: 0 0 30px rgba(0, 255, 255, 0.6), 0 0 60px rgba(0, 255, 255, 0.3);
  margin-bottom: 40px;
}

.menu-btn {
  background: transparent;
  color: #00ffff;
  border: 1px solid #00ffff;
  padding: 14px 48px;
  font-family: 'Courier New', monospace;
  font-size: 24px;
  cursor: pointer;
  margin: 8px;
  letter-spacing: 2px;
  transition: all 0.3s;
}

@media (hover: hover) {
  .menu-btn:hover {
    background: rgba(0, 255, 255, 0.15);
    box-shadow: 0 0 20px rgba(0, 255, 255, 0.4);
  }
}

.menu-btn.touching {
  background: rgba(0, 255, 255, 0.15);
  box-shadow: 0 0 20px rgba(0, 255, 255, 0.4);
  transition: none;
}

.menu-btn.active {
  background: rgba(0, 255, 255, 0.15);
  box-shadow: 0 0 20px rgba(0, 255, 255, 0.4);
}

#lang-select {
  position: absolute;
  top: calc(16px + env(safe-area-inset-top, 0px));
  right: 20px;
  display: flex;
  gap: 4px;
}

.lang-btn {
  background: transparent;
  color: #555;
  border: 1px solid #333;
  padding: 8px 16px;
  font-family: 'Courier New', monospace;
  font-size: 22px;
  cursor: pointer;
  transition: all 0.2s;
}

.lang-btn:hover { color: #aaa; border-color: #666; }
.lang-btn.active {
  color: #00ffff;
  border-color: #00ffff;
}

#difficulty-label {
  color: #666;
  font-family: 'Courier New', monospace;
  font-size: 22px;
  letter-spacing: 3px;
  margin-bottom: 8px;
}

#difficulty-buttons {
  display: flex;
  gap: 12px;
  margin-bottom: 16px;
}

.difficulty-btn .diff-sub {
  display: block;
  font-size: 0.7em;
  opacity: 0.6;
  margin-top: 3px;
  letter-spacing: 1px;
  text-transform: lowercase;
}

.difficulty-btn {
  padding: 12px 24px;
  font-size: 18px;
}

.difficulty-btn[data-difficulty="hard"] {
  color: #ff4444;
  border-color: #ff4444;
}
.difficulty-btn[data-difficulty="hard"]:hover {
  background: rgba(255, 68, 68, 0.15);
  box-shadow: 0 0 20px rgba(255, 68, 68, 0.4);
}

.difficulty-btn[data-difficulty="normal"] {
  color: #ffaa00;
  border-color: #ffaa00;
}
.difficulty-btn[data-difficulty="normal"]:hover {
  background: rgba(255, 170, 0, 0.15);
  box-shadow: 0 0 20px rgba(255, 170, 0, 0.4);
}

.difficulty-btn[data-difficulty="easy"] {
  color: #00ff66;
  border-color: #00ff66;
}
.difficulty-btn[data-difficulty="easy"]:hover {
  background: rgba(0, 255, 100, 0.15);
  box-shadow: 0 0 20px rgba(0, 255, 100, 0.4);
}

/* Pause Overlay */
#pause-overlay {
  position: absolute;
  inset: 0;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: #0a0a0a;
  z-index: 50;
}

#pause-overlay h2 {
  font-family: var(--font-brand);
  color: #00ffff;
  font-size: 36px;
  letter-spacing: 8px;
  text-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
}

#pause-overlay p {
  color: #666;
  margin-top: 16px;
  font-size: 14px;
}

/* Game Over */
#game-over-screen {
  position: absolute;
  inset: 0;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: rgba(0, 0, 0, 0.9);

}

#game-over-screen h2 {

#player-name {

.menu-btn:disabled {

  pointer-events: none;
}

#high-scores-list {
  display: none;
  margin-top: 20px;
  text-align: left;
  font-size: 13px;
  color: #aaa;
  max-height: 40vh;
  overflow-y: auto;
}

#high-scores-list .score-entry {
  padding: 4px 0;
  border-bottom: 1px solid #1a1a1a;
}

@keyframes pulse {
  0%, 100% { opacity: 0.6; }
  50% { opacity: 1; }
}

.hidden { display: none !important; }

/* Tutorial overlay */
#tutorial-overlay {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0, 10, 20, 0.94);
  border: 1px solid #00ffff;
  box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
  padding: 10px 14px;
  max-width: 420px;
  width: 92%;
  z-index: 960;
  text-align: center;
  font-size: 15px;
  line-height: 1.4;
  color: #eee;
}

#tutorial-overlay .tutorial-msg { margin-bottom: 8px; }

#tutorial-overlay .tutorial-actions {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
}

#tutorial-overlay .tutorial-continue {
  font-size: 12px;
  color: #00ffff;
  animation: pulse 1.6s ease-in-out infinite;
}

#tutorial-overlay .tutorial-skip {
  margin-left: auto;
  background: none;
  border: none;
  font-family: var(--font-ui);
  font-size: 12px;
  color: #889;
  text-decoration: underline;
  cursor: pointer;
  padding: 6px 0;
}

#tutorial-overlay .tutorial-skip:hover { color: #00ffff; }

/* Transparent blockers around the step target */
.tutorial-blocker {
  position: fixed;
  z-index: 900;
}

/* Pointing hand; its fingertip sits on the target point */
#tutorial-pointer {
  position: fixed;
  z-index: 950;
  width: 44px;
  height: 44px;
  margin: -2px 0 0 -19px;
  pointer-events: none;
  color: #ffffff;
  filter: drop-shadow(0 0 6px #00ffff) drop-shadow(0 0 2px #000);
  animation: tutorial-tap 1s ease-in-out infinite;
}

@keyframes tutorial-tap {
  0%, 100% { transform: translate(0, 6px); }
  50% { transform: translate(0, 0) scale(0.9); }
}

/* While coaching, the caption replaces the phase label and wave preview */
#game-container.tutorial-on #phase-label,
#game-container.tutorial-on #wave-preview { display: none; }

/* Cancel placement button */
#cancel-place-btn {
  position: absolute;
  bottom: 10px;
  right: 10px;
  background: rgba(255, 68, 68, 0.15);
  color: #ff4444;
  border: 1px solid #ff4444;
  padding: 10px 20px;
  font-family: var(--font-ui);
  font-size: 14px;
  cursor: pointer;
  z-index: 15;
}

/* ==========================================
   MOBILE RESPONSIVE
   ========================================== */

/* Portrait phones */
@media (max-width: 768px) {
  #game-container {
    flex-direction: column;
  }


  #canvas-wrapper { min-height: 0; }

  #ui-overlay { font-size: 20px; }

/* Phone layout, portrait or landscape. The same query is PHONE_LAYOUT in js/ui.js. */
@media (max-width: 768px), (max-height: 500px) and (pointer: coarse) {
  /* Bottom sheet over the tower panel; JS caps its height at the space below the board */
  #upgrade-panel {
    position: fixed;

/* Portrait phones only (a small phone in landscape also matches max-width: 768px) */
@media (max-width: 768px) and (min-height: 501px) {
  /* HUD, board and wave controls stack top to bottom. The board is pinned
     under the HUD, so nothing below it can move it. */
  #canvas-wrapper {
    flex: 0 0 auto;
    min-height: 0;
    flex-direction: column;
    justify-content: flex-start;
  }

  #tower-panel { flex: 1 1 auto; min-height: 0; }

  #hud {
    position: relative;
    align-self: stretch;
    flex: 0 0 auto;
    padding: 6px 8px 6px;
    gap: 4px;

  canvas { flex: 0 0 auto; }

  /* Docked just above the tower panel, below the board */
  #tower-stats-tooltip {
    width: auto;
    max-width: none;
    left: 8px !important;
    right: 8px;
    bottom: 6px;
  }

  /* In the flow at the bottom of the board column: phase line, then preview and button side by side */
  #wave-controls {
    position: static;
    transform: none;
    flex: 0 0 auto;
    min-height: 88px;
    padding: 6px 8px 8px;
    flex-direction: row;
    flex-wrap: wrap;
    justify-content: center;
    gap: 6px 8px;
  }

  #phase-label { flex-basis: 100%; text-align: center; }

  #panel-head { justify-content: space-between; padding: 0 2px; }
}

/* Desktop: HUD, board and wave controls stack like the portrait phone, so
   nothing floats over the board. The board shrinks by height, keeping its
   ratio, on short windows; on tall ones it stays centred under the HUD. */
@media (min-width: 769px) and (min-height: 501px) {
  #canvas-wrapper { flex-direction: column; }

  #hud {
    position: relative;
    align-self: stretch;
    flex: 0 0 auto;
  }

  canvas {
    flex: 0 1 auto;
    min-height: 0;
    margin-top: auto;
  }

  #wave-controls {
    position: static;
    transform: none;
    flex: 0 0 auto;
    /* Height of the tallest state (phase line, preview, button), so hiding
       the preview and the button during a wave never moves the board */
    min-height: 115px;
    margin-bottom: auto;
  }
}

/* Tall portrait phones have room for the one-line tower descriptions */
@media (max-width: 768px) and (min-height: 760px) {
  .tower-btn .tower-desc { display: block; }
}

/* Landscape phones */
@media (max-height: 500px) {
  #game-container {
    flex-direction: row;
  }

  #tower-panel {
    width: 160px;
    max-height: 100vh;
    border-top: none;
    border-left: 1px solid #1a1a2e;
    flex-direction: column;

  }

  .tower-btn {
    flex: unset;
    min-width: unset;
    min-height: 44px;
  }

  .tower-btn .tower-desc { display: none; }

  #ui-overlay { font-size: 16px; }
  .hud-item { flex-direction: row; align-items: baseline; gap: 4px; }
  #hud { padding: 4px 8px; }
}

/* Landscape phones: the sheet and the tower card dock to the right edge,
   full height, over the tower panel column */
@media (max-height: 500px) and (pointer: coarse) {
  #upgrade-panel,
  #tower-stats-tooltip {
    position: fixed;
    left: auto !important;
    right: 0;
    top: 0 !important;
    bottom: 0;
    width: 320px;
    max-width: none;
    max-height: none !important;
    border: none;
    border-left: 1px solid rgba(0, 255, 255, 0.4);
    border-radius: 12px 0 0 12px;
  }
}

/* Touch devices: larger tap targets */
@media (pointer: coarse) {
  .speed-btn {
    min-width: 44px;
    min-height: 44px;
    padding: 10px 12px;
  }

  .tower-btn { min-height: 48px; }
  .menu-btn { min-height: 48px; padding: 12px 32px; }
  #start-wave-btn { min-height: 48px; }
  #cancel-place-btn { min-height: 44px; }
  #pause-overlay p { display: none; }
}

/* PWA install banner */
#pwa-banner {

@keyframes pwa-slide-up {
  from { transform: translateX(-50%) translateY(100%); opacity: 0; }
  to { transform: translateX(-50%) translateY(0); opacity: 1; }
}

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js');
    });
  }
  // PWA install prompt
  (function() {
    const isStandalone = window.matchMedia('(display-mode: standalone)').matches
      || window.navigator.standalone === true;
    if (isStandalone) return;
    if (localStorage.getItem('neon_td_pwa_dismissed')) return;

    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
    const isAndroid = /Android/.test(navigator.userAgent);
    if (!isIOS && !isAndroid) return;

    let deferredPrompt = null;

    function getIsIT() {
      const lang = localStorage.getItem('neon_td_lang') || (navigator.language || '').slice(0, 2);
      return lang === 'it';
    }

    function showBanner(text) {
      const banner = document.getElementById('pwa-banner');
      document.getElementById('pwa-banner-text').innerHTML = text;
      banner.classList.remove('hidden');
      document.getElementById('pwa-banner-close').addEventListener('click', () => {
        banner.classList.add('hidden');
        localStorage.setItem('neon_td_pwa_dismissed', '1');
      });
    }

    if (isIOS) {
      setTimeout(() => {
        const text = getIsIT()
          ? 'Installa come app: tocca <strong style="color:#00ffff">Condividi</strong> poi <strong style="color:#00ffff">Aggiungi alla Home</strong>'
          : 'Install as app: tap <strong style="color:#00ffff">Share</strong> then <strong style="color:#00ffff">Add to Home Screen</strong>';
        showBanner(text);
      }, 2000);
    } else {
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        setTimeout(() => {
          const text = getIsIT()
            ? 'Installa come app per la migliore esperienza! <strong style="color:#00ffff;cursor:pointer" id="pwa-install-btn">INSTALLA</strong>'
            : 'Install as app for the best experience! <strong style="color:#00ffff;cursor:pointer" id="pwa-install-btn">INSTALL</strong>';
          showBanner(text);
          document.getElementById('pwa-install-btn')?.addEventListener('click', () => {
            deferredPrompt.prompt();
            document.getElementById('pwa-banner').classList.add('hidden');
            localStorage.setItem('neon_td_pwa_dismissed', '1');
          });
        }, 2000);
      });
    }
  })();

  // Touch feedback for menu buttons (CSS :active is unreliable on iOS)
  document.addEventListener('touchstart', (e) => {
    const btn = e.target.closest('.menu-btn');
    if (btn) btn.classList.add('touching');
  }, { passive: true });
  ['touchend', 'touchcancel'].forEach((ev) => {
    document.addEventListener(ev, (e) => {
      const btn = e.target.closest('.menu-btn');
      if (btn) btn.classList.remove('touching');
    }, { passive: true });
  });
</script>
