<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>NEON DEFENSE</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%230a0a0a'/%3E%3Cpolygon points='16,4 28,28 4,28' fill='none' stroke='%2300ffff' stroke-width='2'/%3E%3Ccircle cx='16' cy='18' r='4' fill='%2300ffff' opacity='0.8'/%3E%3C/svg%3E">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#00ffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NEON DEFENSE">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

/* Game-screen type and text colours. Greys stay at 4.5:1 or more on #0a0a0a. */
:root {
  --font-ui: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-brand: 'Courier New', monospace;
  --text-1: #f0f0f0;
  --text-2: #b8b8c0;
  --text-3: #8c8c96;
}

body {
  background: #0a0a0a;
  color: #e0e0e0;
  font-family: var(--font-ui);
  overflow: hidden;
  user-select: none;
  touch-action: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}

/* 100dvh after 100vh, so browsers that know dvh size the game to the
   visible viewport; the safe-area padding keeps everything off the notch,
   the home indicator and the side cut-outs */
#game-container {
  display: flex;
  width: 100vw;
  height: 100vh;
  height: 100dvh;
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
  background: #0a0a0a;
}

#canvas-wrapper {
  position: relative;
  flex: 1;
  min-width: 0;
  min-height: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* The space the board may fill. fitBoard (js/ui.js) sizes the canvas inside
   it; the slot itself never depends on the canvas size. */
#board-slot {
  flex: 1 1 0;
  min-width: 0;
  min-height: 0;
  align-self: stretch;
  display: flex;
  justify-content: center;
  align-items: flex-start;
}

/* The outline is drawn inside the canvas, so the board keeps its full size */
canvas {
  display: block;
  flex-shrink: 0;
  cursor: crosshair;
  touch-action: none;
  outline: 1px solid rgba(255, 255, 255, 0.15);
  outline-offset: -1px;
}

/* HUD: row 1 has the counters, row 2 the next-unlock progress and the controls */
#hud {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 8px 16px 6px;
  background: linear-gradient(to bottom, rgba(0,0,0,0.9), rgba(0,0,0,0.6) 70%, transparent);
  pointer-events: none;
  z-index: 10;
}

#ui-overlay {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  justify-items: center;
  font-size: 22px;
}

.hud-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  min-width: 0;
  line-height: 1.15;
}

.hud-main {
  display: flex;
  align-items: center;
  gap: 5px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.hud-label {
  font-size: 12px;
  color: var(--text-2);
}

#hud-gold { color: #ffd700; }
#hud-wave { color: #00ffff; }
#hud-lives { color: #ff5555; }
#hud-score { color: #ffffff; }

/* Inline SVG icons (js/icons.js) */
.icon {
  width: 1em;
  height: 1em;
  flex-shrink: 0;
  vertical-align: -0.15em;
  margin-right: 0.25em;
}

/* The glow sits on the icon so the digits stay sharp */
.hud-item .icon { width: 0.9em; height: 0.9em; margin-right: 0; filter: drop-shadow(0 0 4px currentColor); }
.hud-total { color: var(--text-2); font-size: max(12px, 0.65em); font-weight: 600; }

#hud-row2 {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

/* Unlock Tracker */
/* As wide as one counter column and centred in it, so it lines up under Gold */
#unlock-tracker {
  flex: 0 0 25%;
  min-width: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  line-height: 1.25;
  pointer-events: none;
}

#unlock-tracker.hidden { display: flex !important; visibility: hidden; }

/* Core balance: the persistent unlock currency */
#unlock-tracker .unlock-cores { color: #c77dff; font-size: 1.3em; }
#unlock-tracker .unlock-cores.hud-pulse { animation: hud-pulse 0.35s ease-out; }

/* Speed, pause and sound */
#speed-controls {
  display: flex;
  gap: 4px;
  pointer-events: auto;
}

.speed-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 44px;
  height: 44px;
  padding: 0 12px;
  background: rgba(20, 20, 20, 0.85);
  color: var(--text-1);
  border: 1px solid #555;
  font-family: var(--font-ui);
  font-size: 15px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  cursor: pointer;
  transition: all 0.2s;
}

.speed-btn .icon { width: 20px; height: 20px; margin: 0; }
.speed-btn:hover { border-color: #888; }
.speed-btn.active {
  color: #00ffff;
  border-color: #00ffff;
  box-shadow: 0 0 8px rgba(0, 255, 255, 0.3);
}

/* Tower Panel */
#tower-panel {
  width: 200px;
  background: #0d0d0d;
  border-left: 1px solid #1a1a2e;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  overflow-y: auto;
  transition: opacity 0.3s ease;
}

#tower-panel.panel-hidden {
  opacity: 0;
  pointer-events: none;
}

/* Heading and mid-wave note share one row, so the panel height never changes */
#panel-head {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  justify-content: center;
  column-gap: 12px;
  margin-bottom: 4px;
}

#tower-panel h3 {
  color: #00ffff;
  font-size: 18px;
  text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
}

.tower-btn {
  background: rgba(20, 20, 30, 0.8);
  border: 1px solid var(--tower-color, #333);
  padding: 8px;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  gap: 8px;
}

.tower-btn .tower-pic {
  width: 40px;
  height: 40px;
  flex-shrink: 0;
}

.tower-btn .tower-text {
  display: flex;
  flex-direction: column;
  gap: 3px;
  min-width: 0;
}

.tower-btn.tower-locked .tower-pic {
  filter: grayscale(1) brightness(0.45);
}

.tower-pic-wrap {
  position: relative;
  display: flex;
  flex-shrink: 0;
}

.tower-pic-wrap .icon {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 55%;
  height: 55%;
  margin: 0;
  transform: translate(-50%, -50%);
  color: #ff8800;
  filter: drop-shadow(0 0 2px #000);
}

.tower-btn .tower-need {
  font-family: var(--font-ui);
  font-size: 12px;
  color: #ff8866;
}

.tower-btn .tower-need:empty { display: none; }

/* Lock price as core icon and number: the compact phone tray only */
.tower-btn .tower-short-price { display: none; }

.tower-btn:hover {
  box-shadow: 0 0 12px var(--tower-color, #333);
  background: rgba(30, 30, 50, 0.8);
}

.tower-btn.selected {
  background: rgba(255, 255, 255, 0.1);
  box-shadow: 0 0 16px var(--tower-color, #333), 0 0 30px var(--tower-color, #333), inset 0 0 12px rgba(255,255,255,0.08);
}

.tower-btn .tower-name {
  font-family: var(--font-ui);
  font-size: 15px;
  color: var(--tower-color, #ccc);
  font-weight: bold;
}

.tower-btn .tower-cost {
  font-family: var(--font-ui);
  font-size: 14px;
  color: #ffd700;
}

.tower-btn .tower-desc {
  font-family: var(--font-ui);
  font-size: 13px;
  color: var(--text-3);
}

/* Unaffordable towers: the picture fades, the text stays readable and "Need N more" says why */
.tower-btn.tower-unaffordable { border-color: #555; }
.tower-btn.tower-unaffordable .tower-pic { opacity: 0.45; }

/* Locked towers */
.tower-btn.tower-locked {
  border-color: #333;
}

.tower-btn .locked-name {
  color: var(--text-3) !important;
}

.tower-btn .tower-unlock-req {
  font-family: var(--font-ui);
  font-size: 12px;
  color: #ff8800;
}

.tower-btn.tower-can-unlock { cursor: pointer; border-color: #c77dff; }
.tower-btn.tower-locked.tower-can-unlock .tower-pic { filter: none; }
.tower-btn.tower-can-unlock .tower-pic-wrap .icon { color: #c77dff; }
.up-pic, .unlock-pic { width: 40px; height: 40px; vertical-align: middle; }
.tower-unlocked-pulse { animation: unlock-card-pulse 0.7s ease-out; }
@keyframes unlock-card-pulse { 50% { box-shadow: 0 0 18px var(--tower-color); } }
@media (prefers-reduced-motion: reduce) { .tower-unlocked-pulse { animation: none; } }
#game-over-screen h2.victory { color: #00ff66; text-shadow: 0 0 20px rgba(0,255,102,0.5); }
.tower-btn.tower-can-unlock .tower-unlock-req { color: #c77dff; }

#unlock-notification {
  position: absolute;
  top: 35%;
  left: 50%;
  transform: translateX(-50%) translateY(-10px);
  background: rgba(0, 10, 20, 0.95);
  border: 1px solid #00ff66;
  box-shadow: 0 0 30px rgba(0, 255, 100, 0.4), 0 0 60px rgba(0, 255, 100, 0.15);
  padding: 20px 36px;
  z-index: 90;
  text-align: center;
  font-family: var(--font-ui);
  opacity: 0;
  transition: opacity 0.5s, transform 0.5s;
  pointer-events: none;
}

#unlock-notification.unlock-visible {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

#unlock-notification .unlock-title {
  font-size: 18px;
  color: #00ff66;
  text-shadow: 0 0 15px rgba(0, 255, 100, 0.6);
  margin-bottom: 8px;
}

#unlock-notification .unlock-names {
  font-size: 16px;
  font-weight: bold;
}

/* Upgrade Panel */
#upgrade-panel {
  position: absolute;
  background: #0a0a0f;
  border: 1px solid #333;
  padding: 12px;
  z-index: 20;
  min-width: 300px;
  display: none;
  font-family: var(--font-ui);
}

#upgrade-panel .up-title { font-weight: bold; margin-bottom: 4px; font-size: 16px; padding-right: 36px; }
#upgrade-panel .up-close {
  position: absolute; top: 2px; right: 2px;
  width: 44px; height: 44px;
  background: none; border: none;
  color: var(--text-2); font-size: 26px; line-height: 1;
  cursor: pointer;
}
#upgrade-panel .up-close:hover { color: var(--text-1); }
#upgrade-panel .up-stats {
  display: flex; gap: 10px; flex-wrap: wrap;
  font-size: 13px; color: var(--text-2); padding: 4px 0 6px;
  border-bottom: 1px solid #1a1a2e; margin-bottom: 4px;
}
#upgrade-panel .up-stats span { white-space: nowrap; }
#upgrade-panel .up-path-name { margin-top: 6px; color: var(--text-1); font-size: 14px; font-weight: 600; }
#upgrade-panel .up-path-locked { color: #ff8866; font-size: 12px; margin: 2px 0; }
#upgrade-panel .up-cost .icon { color: inherit; }
#upgrade-panel .up-level {
  display: flex; align-items: center; gap: 8px;
  padding: 4px 6px; margin: 2px 0; border: 1px solid transparent; border-radius: 2px;
}
#upgrade-panel .up-cost { font-size: 14px; font-weight: bold; min-width: 44px; }
#upgrade-panel .up-info { display: flex; flex-direction: column; gap: 1px; }
#upgrade-panel .up-desc { font-size: 13px; }
#upgrade-panel .up-changes { font-size: 12px; color: var(--text-3); }
#upgrade-panel .up-need { font-size: 12px; color: #ff8866; }
#upgrade-panel .up-purchased .up-changes { color: #6fcf97; }
#upgrade-panel .up-available .up-changes { color: #66ccff; }
#upgrade-panel .up-check { color: #00ff66; font-size: 15px; min-width: 44px; }
#upgrade-panel .up-purchased .up-desc { color: #00e676; }
#upgrade-panel .up-available {
  cursor: pointer; background: rgba(255, 215, 0, 0.12);
  border: 1px solid rgba(255, 215, 0, 0.5);
  box-shadow: 0 0 10px rgba(255, 215, 0, 0.3), 0 0 20px rgba(255, 215, 0, 0.1), inset 0 0 10px rgba(255, 215, 0, 0.08);
  animation: up-glow 2s ease-in-out infinite;
}
#upgrade-panel .up-available:hover {
  background: rgba(255, 215, 0, 0.22); border-color: rgba(255, 215, 0, 0.7);
  box-shadow: 0 0 16px rgba(255, 215, 0, 0.5), 0 0 30px rgba(255, 215, 0, 0.2), inset 0 0 14px rgba(255, 215, 0, 0.1);
  animation: none;
}
@keyframes up-glow {
  0%, 100% { box-shadow: 0 0 8px rgba(255, 215, 0, 0.2), 0 0 16px rgba(255, 215, 0, 0.08), inset 0 0 8px rgba(255, 215, 0, 0.05); }
  50% { box-shadow: 0 0 14px rgba(255, 215, 0, 0.4), 0 0 28px rgba(255, 215, 0, 0.15), inset 0 0 12px rgba(255, 215, 0, 0.1); }
}
#upgrade-panel .up-available .up-cost { color: #ffd700; }
#upgrade-panel .up-available .up-desc { color: #fff; }
#upgrade-panel .up-unaffordable {
  border: 1px solid rgba(255, 255, 255, 0.12);
  background: rgba(255, 255, 255, 0.02);
}
#upgrade-panel .up-unaffordable .up-cost { color: var(--text-2); }
#upgrade-panel .up-unaffordable .up-desc { color: var(--text-1); }
#upgrade-panel .up-locked .up-cost,
#upgrade-panel .up-locked .up-desc { color: var(--text-3); }
#upgrade-panel .up-actions { margin-top: 8px; display: flex; gap: 12px; }
#upgrade-panel .move-btn { font-size: 14px; color: #33bbff; cursor: pointer; }
#upgrade-panel .sell-btn { font-size: 14px; color: #ff6666; cursor: pointer; }

/* Tower Stats Tooltip */
#tower-stats-tooltip {
  position: absolute;
  background: #0a0a0f;
  border: 1px solid #333;
  padding: 10px 12px;
  z-index: 25;
  min-width: 220px;
  max-width: 280px;
  font-family: var(--font-ui);
  pointer-events: none;
  opacity: 0;
  transform: translateY(4px);
  transition: opacity 150ms ease-out, transform 150ms ease-out;
  visibility: hidden;
}

#tower-stats-tooltip.visible {
  opacity: 1;
  transform: translateY(0);
  visibility: visible;
}

#tower-stats-tooltip .ttp-title { font-weight: bold; font-size: 15px; margin-bottom: 2px; display: flex; align-items: center; gap: 6px; }
#tower-stats-tooltip .ttp-pic { width: 32px; height: 32px; }
#tower-stats-tooltip .ttp-desc { font-size: 13px; color: var(--text-2); margin-bottom: 6px; }
#tower-stats-tooltip .ttp-stats {
  display: flex; gap: 8px; flex-wrap: wrap;
  font-size: 13px; color: var(--text-2);
  padding: 4px 0; border-top: 1px solid #1a1a2e;
}
#tower-stats-tooltip .ttp-stats span { white-space: nowrap; }
.stat .icon { opacity: 0.8; }
#tower-stats-tooltip .ttp-stat-val { font-weight: bold; }
#tower-stats-tooltip .ttp-targeting { font-size: 12px; color: var(--text-3); margin-top: 4px; }
#tower-stats-tooltip .ttp-locked-hint { font-size: 12px; color: #ff8800; margin-top: 6px; }
#tower-stats-tooltip .ttp-need { font-size: 13px; color: #ff8866; margin-top: 6px; }
#tower-stats-tooltip .ttp-place-btn { display: none; }

.tower-btn.previewing {
  background: rgba(255, 255, 255, 0.08);
  box-shadow: 0 0 12px var(--tower-color, #333), inset 0 0 8px rgba(255,255,255,0.05);
}

/* Wave Controls Wrapper */
#wave-controls {
  position: absolute;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  z-index: 10;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
}

#wave-controls.visible {
  opacity: 1;
  pointer-events: auto;
}

/* Wave Preview */
#wave-preview {
  background: rgba(0,0,0,0.7);
  padding: 6px 16px;
  font-size: 16px;
  color: var(--text-2);
  border: 1px solid #333;
}

.up-feedback { margin-top: 8px; font-size: 13px; color: #6fcf97; }
#wave-progress { display: none; font-size: 13px; color: var(--text-2); text-align: center; }
#game-container[data-phase="wave"] #wave-progress { display: block; }

/* Phase: label above the wave controls, tower list inactive during a wave */
#phase-label {
  white-space: nowrap;
  font-size: 15px;
  font-weight: 600;
  color: #00ffff;
}

#game-container[data-phase="wave"] #phase-label { color: #ff8800; }
#game-container[data-phase="wave"] #wave-preview,
#game-container[data-phase="wave"] #start-wave-btn { display: none; }

#build-note {
  visibility: hidden;
  font-size: 13px;
  font-weight: 600;
  color: #ff8800;
  text-align: center;
}

#game-container[data-phase="wave"] #build-note { visibility: visible; }
#game-container[data-phase="wave"] .tower-btn:not(.tower-locked) { pointer-events: none; }
#game-container[data-phase="wave"] .tower-btn { background: rgba(10, 10, 14, 0.9); box-shadow: none; }
#game-container[data-phase="wave"] .tower-btn:not(.tower-locked) .tower-pic { filter: grayscale(0.7); }

/* Wave preview enemy pictures */
#wave-preview { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
#wave-preview-content { display: inline-flex; flex-wrap: wrap; align-items: center; }
.wp-enemy { display: inline-flex; align-items: center; gap: 2px; margin-right: 6px; }
.wp-pic { width: 22px; height: 22px; }

/* HUD feedback */
@keyframes hud-hit {
  0%, 100% { transform: translateX(0); }
  15% { transform: translateX(-4px) scale(1.25); color: #fff; }
  30% { transform: translateX(4px) scale(1.25); }
  45% { transform: translateX(-3px) scale(1.15); color: #fff; }
  60% { transform: translateX(3px); }
}
#hud-lives.hud-hit { animation: hud-hit 0.5s ease-out; }

@keyframes hud-pulse {
  0%, 100% { transform: scale(1); }
  40% { transform: scale(1.2); color: #fff6b0; }
}
#hud-gold.hud-pulse { animation: hud-pulse 0.35s ease-out; }

/* Start Wave Button */
#start-wave-btn {
  background: rgba(0, 255, 255, 0.1);
  color: #00ffff;
  border: 1px solid #00ffff;
  padding: 10px 30px;
  font-family: var(--font-ui);
  font-size: 20px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
}

#start-wave-btn:hover:not(:disabled) {
  background: rgba(0, 255, 255, 0.2);
  box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
}

#start-wave-btn:disabled {
  color: var(--text-3);
  border-color: #444;
  background: transparent;
  cursor: default;
}

/* Menu Screen: one centred column over a faint board grid. The two spacers
   centre it vertically and shrink to nothing when the open scores need the
   height, so the menu scrolls instead of clipping. */
#menu-screen {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: calc(72px + env(safe-area-inset-top, 0px)) 16px calc(24px + env(safe-area-inset-bottom, 0px));
  overflow-y: auto;
  background:
    radial-gradient(ellipse at 50% 40%, rgba(0, 255, 255, 0.07), transparent 55%),
    radial-gradient(ellipse at 50% 40%, transparent 20%, #0a0a0a 75%),
    linear-gradient(rgba(0, 255, 255, 0.06) 1px, transparent 1px) 50% 0 / 40px 40px,
    linear-gradient(90deg, rgba(0, 255, 255, 0.06) 1px, transparent 1px) 50% 0 / 40px 40px,
    #0a0a0a;
  z-index: 100;
}

#menu-screen::before,
#menu-screen::after { content: ''; flex: 1 0 0; }

/* Sized by the width on phones and by the height in landscape. The negative
   margin takes back the letter spacing after the last letter, so the title
   sits centred. */
#menu-screen h1 {
  font-family: var(--font-brand);
  font-size: clamp(30px, min(9.5vw, 12vh), 72px);
  line-height: 1.1;
  text-align: center;
  color: #00ffff;
  letter-spacing: 0.16em;
  margin: 0 -0.16em clamp(20px, 6vh, 44px) 0;
  text-shadow: 0 0 30px rgba(0, 255, 255, 0.6), 0 0 60px rgba(0, 255, 255, 0.3);
  animation: menu-in 0.5s ease-out both;
}

@keyframes menu-in {
  from { opacity: 0; transform: translateY(8px); }
}

@media (prefers-reduced-motion: reduce) { #menu-screen h1 { animation: none; } }

/* --accent is the button colour as r, g, b, so hover and press can tint it */
.menu-btn {
  --accent: 0, 255, 255;
  background: transparent;
  color: #00ffff;
  border: 1px solid #00ffff;
  padding: 14px 48px;
  font-family: 'Courier New', monospace;
  font-size: 24px;
  cursor: pointer;
  margin: 8px;
  letter-spacing: 2px;
  transition: all 0.3s;
}

@media (hover: hover) {
  .menu-btn:hover {
    background: rgba(var(--accent), 0.15);
    box-shadow: 0 0 20px rgba(var(--accent), 0.4);
  }
}

.menu-btn.touching {
  background: rgba(var(--accent), 0.15);
  box-shadow: 0 0 20px rgba(var(--accent), 0.4);
  transition: none;
}

.menu-btn.active {
  background: rgba(var(--accent), 0.15);
  box-shadow: 0 0 20px rgba(var(--accent), 0.4);
}

/* EN and IT as one segmented control */
#lang-select {
  position: absolute;
  top: calc(16px + env(safe-area-inset-top, 0px));
  right: calc(16px + env(safe-area-inset-right, 0px));
  display: flex;
}

.lang-btn {
  min-width: 48px;
  min-height: 44px;
  background: rgba(10, 10, 10, 0.8);
  color: var(--text-3);
  border: 1px solid #333;
  font-family: var(--font-brand);
  font-size: 15px;
  letter-spacing: 1px;
  cursor: pointer;
  transition: all 0.2s;
}

.lang-btn + .lang-btn { margin-left: -1px; }
.lang-btn:hover { color: var(--text-1); }
.lang-btn.active {
  position: relative;
  color: #00ffff;
  border-color: #00ffff;
  background: rgba(0, 255, 255, 0.1);
}

#difficulty-label {
  color: var(--text-3);
  font-family: var(--font-brand);
  font-size: 13px;
  letter-spacing: 0.3em;
  margin: 0 -0.3em 12px 0;
  text-align: center;
}

/* The game starts here, so these are the strongest buttons: a column on
   phones, one row of equal buttons when there is room */
#difficulty-buttons {
  display: flex;
  flex-direction: column;
  gap: 10px;
  width: min(320px, 100%);
}

#difficulty-buttons .difficulty-btn {
  flex: 1 1 0;
  margin: 0;
  min-height: 64px;
  padding: 10px 16px;
  font-size: 20px;
  font-weight: bold;
  color: rgb(var(--accent));
  border-color: rgb(var(--accent));
  background: rgba(var(--accent), 0.06);
  box-shadow: inset 0 0 12px rgba(var(--accent), 0.08);
}

.difficulty-btn[data-difficulty="easy"] { --accent: 0, 255, 102; }
.difficulty-btn[data-difficulty="normal"] { --accent: 255, 170, 0; }
.difficulty-btn[data-difficulty="hard"] { --accent: 255, 68, 68; }

.difficulty-btn .diff-sub {
  display: block;
  font-size: 13px;
  font-weight: normal;
  color: var(--text-2);
  margin-top: 4px;
  letter-spacing: 1px;
  text-transform: lowercase;
}

@media (min-width: 600px) {
  #difficulty-buttons { flex-direction: row; width: min(600px, 100%); gap: 12px; }
}

/* Secondary: quieter than the difficulty buttons, cyan only while open */
#high-scores-btn {
  margin: 24px 0 0;
  min-height: 48px;
  padding: 10px 28px;
  font-size: 15px;
  color: var(--text-2);
  border-color: #444;
}

#high-scores-btn.active { color: #00ffff; border-color: #00ffff; }

/* Pause Overlay */
#pause-overlay {
  position: absolute;
  inset: 0;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: #0a0a0a;
  z-index: 50;
}

#pause-overlay h2 {
  font-family: var(--font-brand);
  color: #00ffff;
  font-size: 36px;
  letter-spacing: 8px;
  text-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
}

#pause-overlay p {
  color: #666;
  margin-top: 16px;
  font-size: 14px;
}

/* Game Over */
#game-over-screen {
  position: absolute;
  inset: 0;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: rgba(0, 0, 0, 0.9);
  z-index: 100;
  gap: 12px;
}

#game-over-screen h2 {
  font-family: var(--font-brand);
  color: #ff4444;
  font-size: 36px;
  letter-spacing: 6px;
  text-shadow: 0 0 20px rgba(255, 68, 68, 0.5);
}

#game-over-screen p { color: #aaa; font-size: 14px; }

#player-name {
  background: #111;
  border: 1px solid #333;
  color: #fff;
  padding: 8px 16px;
  font-family: 'Courier New', monospace;
  font-size: 14px;
  text-align: center;
  outline: none;
}

#player-name:focus { border-color: #00ffff; }

.menu-btn:disabled {
  opacity: 0.3;
  cursor: default;
  pointer-events: none;
}

#high-scores-list {
  display: none;
  width: min(360px, 100%);
  box-sizing: border-box;
  margin-top: 20px;
  text-align: left;
  font-size: 13px;
  color: #aaa;
  max-height: 40vh;
  overflow-y: auto;
}

#high-scores-list .score-entry {
  padding: 4px 0;
  border-bottom: 1px solid #1a1a1a;
}

/* One board per difficulty; tabs stay on top while the list scrolls */
#high-scores-list .board-tabs {
  position: sticky;
  top: 0;
  display: flex;
  gap: 6px;
  padding-bottom: 6px;
  background: #0a0a0a;
}

#high-scores-list .board-tab {
  flex: 1 1 0;
  min-width: 0;
  min-height: 44px;
  background: transparent;
  color: #888;
  border: 1px solid #333;
  font-family: 'Courier New', monospace;
  font-size: 13px;
  letter-spacing: 1px;
  cursor: pointer;
}

#high-scores-list .board-tab[data-board="easy"].active { color: #00ff66; border-color: #00ff66; background: rgba(0, 255, 100, 0.1); }
#high-scores-list .board-tab[data-board="normal"].active { color: #ffaa00; border-color: #ffaa00; background: rgba(255, 170, 0, 0.1); }
#high-scores-list .board-tab[data-board="hard"].active { color: #ff4444; border-color: #ff4444; background: rgba(255, 68, 68, 0.1); }

/* Rank, name, score and wave in columns, so scores line up */
#high-scores-list .score-entry {
  display: grid;
  grid-template-columns: 2em 1fr auto 5.5em;
  gap: 10px;
  align-items: baseline;
  padding: 8px 4px;
}
#high-scores-list .se-rank { color: #555; text-align: right; }
#high-scores-list .se-name { color: #ddd; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#high-scores-list .se-score { color: #fff; text-align: right; font-variant-numeric: tabular-nums; }
#high-scores-list .se-wave { color: #666; font-size: 11px; text-align: right; }
#high-scores-list .board-empty { color: #666; padding: 16px 0; text-align: center; }

@keyframes pulse {
  0%, 100% { opacity: 0.6; }
  50% { opacity: 1; }
}

.hidden { display: none !important; }

/* Tutorial overlay */
#tutorial-overlay {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0, 10, 20, 0.94);
  border: 1px solid #00ffff;
  box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
  padding: 10px 14px;
  max-width: 420px;
  width: 92%;
  z-index: 960;
  text-align: center;
  font-size: 15px;
  line-height: 1.4;
  color: #eee;
}

#tutorial-overlay .tutorial-msg { margin-bottom: 8px; }

#tutorial-overlay .tutorial-actions {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
}

#tutorial-overlay .tutorial-continue {
  font-size: 12px;
  color: #00ffff;
  animation: pulse 1.6s ease-in-out infinite;
}

#tutorial-overlay .tutorial-skip {
  margin-left: auto;
  background: none;
  border: none;
  font-family: var(--font-ui);
  font-size: 12px;
  color: #889;
  text-decoration: underline;
  cursor: pointer;
  padding: 6px 0;
}

#tutorial-overlay .tutorial-skip:hover { color: #00ffff; }

/* Transparent blockers around the step target */
.tutorial-blocker {
  position: fixed;
  z-index: 900;
}

/* Pointing hand; its fingertip sits on the target point */
#tutorial-pointer {
  position: fixed;
  z-index: 950;
  width: 44px;
  height: 44px;
  margin: -2px 0 0 -19px;
  pointer-events: none;
  color: #ffffff;
  filter: drop-shadow(0 0 6px #00ffff) drop-shadow(0 0 2px #000);
  animation: tutorial-tap 1s ease-in-out infinite;
}

@keyframes tutorial-tap {
  0%, 100% { transform: translate(0, 6px); }
  50% { transform: translate(0, 0) scale(0.9); }
}

/* While coaching, the caption replaces the phase label and wave preview */
#game-container.tutorial-on #phase-label,
#game-container.tutorial-on #wave-preview { display: none; }

/* Cancel placement button */
#cancel-place-btn {
  position: absolute;
  bottom: 10px;
  right: 10px;
  background: rgba(255, 68, 68, 0.15);
  color: #ff4444;
  border: 1px solid #ff4444;
  padding: 10px 20px;
  font-family: var(--font-ui);
  font-size: 14px;
  cursor: pointer;
  z-index: 15;
}

/* ==========================================
   MOBILE RESPONSIVE
   ========================================== */

/* Portrait phones */
@media (max-width: 768px) {
  #game-container {
    flex-direction: column;
  }


  #canvas-wrapper { min-height: 0; }

  #ui-overlay { font-size: 20px; }

  #unlock-tracker { font-size: 12px; }

  .speed-btn { padding: 0 10px; font-size: 14px; }

  #tower-panel {
    width: 100%;
    border-left: none;
    border-top: 1px solid #1a1a2e;
    flex-direction: column;
    padding: 6px 10px 8px;
    gap: 4px;
    overflow-y: visible;
  }

  #tower-panel h3 {
    font-size: 14px;
    margin-bottom: 2px;
  }

  #tower-list {
    display: grid;
    grid-template-columns: repeat(6, minmax(0, 1fr));
    gap: 6px;
  }

  #start-wave-btn {
    padding: 8px 18px;
    font-size: 15px;
  }

  #wave-preview {
    font-size: 14px;
    padding: 4px 10px;
  }

  #high-scores-list {
    max-height: 55vh;
  }

  .menu-btn {
    padding: 14px 36px;
    font-size: 16px;
    min-height: 48px;
  }

  #game-over-screen h2 { font-size: 28px; }
  #pause-overlay h2 { font-size: 28px; }
}

/* Phone layout, portrait or landscape. The same query is PHONE_LAYOUT in js/ui.js. */
@media (max-width: 768px), (max-height: 500px) and (pointer: coarse) {
  /* Sheet on the screen edge away from the selected tower: bottom, or top
     with .sheet-top. JS caps its size at the near edge of the tower's tile. */
  #upgrade-panel {
    position: fixed;
    min-width: unset;
    left: 0 !important;
    right: 0;
    bottom: 0;
    top: auto !important;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 14px 16px calc(14px + env(safe-area-inset-bottom, 0px));
    border: none;
    border-top: 1px solid rgba(0, 255, 255, 0.4);
    border-radius: 12px 12px 0 0;
    box-shadow: 0 -8px 24px rgba(0, 0, 0, 0.7);
    z-index: 30;
  }

  #upgrade-panel.sheet-top {
    top: 0 !important;
    bottom: auto;
    padding: calc(14px + env(safe-area-inset-top, 0px)) 16px 14px;
    border-top: none;
    border-bottom: 1px solid rgba(0, 255, 255, 0.4);
    border-radius: 0 0 12px 12px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.7);
  }
  #upgrade-panel.sheet-top .up-close { top: calc(2px + env(safe-area-inset-top, 0px)); }

  /* Compact tray: picture over price. Name, description, unlock sentence
     and "Need N more" are in the tower card; the name is the aria-label. */
  .tower-btn {
    flex-direction: column;
    justify-content: center;
    min-width: 0;
    min-height: 52px;
    padding: 4px 2px;
    gap: 3px;
  }
  .tower-btn .tower-pic { width: 32px; height: 32px; }
  .tower-btn .tower-text { align-items: center; }
  .tower-btn .tower-name,
  .tower-btn .tower-desc,
  .tower-btn .tower-need,
  .tower-btn .tower-unlock-req { display: none; }
  .tower-btn .tower-cost,
  .tower-btn .tower-short-price { font-size: 13px; font-weight: 600; white-space: nowrap; }
  .tower-btn .tower-short-price { display: inline-flex; align-items: center; color: #ff8800; }
  .tower-btn.tower-can-unlock .tower-short-price { color: #c77dff; }
  .tower-btn.tower-unaffordable .tower-cost { color: #ff8866; }

  #upgrade-panel .up-title { font-size: 18px; margin-bottom: 6px; }
  #upgrade-panel .up-stats { font-size: 13px; gap: 12px; }
  #upgrade-panel .up-path-name { font-size: 15px; margin-top: 10px; }
  #upgrade-panel .up-level { padding: 8px 6px; }
  #upgrade-panel .up-cost { font-size: 15px; min-width: 56px; }
  #upgrade-panel .up-desc { font-size: 14px; }
  #upgrade-panel .up-changes { font-size: 12px; }
  #upgrade-panel .up-check { font-size: 15px; min-width: 56px; }
  #upgrade-panel .up-actions { margin-top: 12px; gap: 20px; }
  #upgrade-panel .move-btn { font-size: 15px; padding: 8px 0; }
  #upgrade-panel .sell-btn { font-size: 15px; padding: 8px 0; }


  #tower-stats-tooltip {
    min-width: unset;
    width: 90%;
    left: 5% !important;
    top: auto !important;
    pointer-events: auto;
    max-height: 35vh;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 14px;
  }

  #tower-stats-tooltip .ttp-place-btn {
    display: block;
    margin-top: 10px;
    background: rgba(0, 255, 255, 0.12);
    color: #00ffff;
    border: 1px solid #00ffff;
    padding: 10px 20px;
    font-family: var(--font-ui);
    font-size: 14px;
    cursor: pointer;
    text-align: center;
    min-height: 44px;
    width: 100%;
  }

  #tower-stats-tooltip .ttp-place-btn:disabled {
    color: var(--text-3);
    border-color: #333;
    background: transparent;
    cursor: default;
  }

  #tower-stats-tooltip .ttp-place-btn:not(:disabled):active {
    background: rgba(0, 255, 255, 0.25);
  }

  /* CANCEL is a flex item of the wave controls (js/ui.js moves it there), and
     the wave preview makes room for it while a tower is carried */
  #wave-controls #cancel-place-btn { position: static; }
  #game-container[data-carry] #wave-preview { display: none; }
}

/* Portrait phones only (a small phone in landscape also matches max-width: 768px) */
@media (max-width: 768px) and (min-height: 501px) {
  /* HUD, board, wave controls, free space, tray. The board is pinned under
     the HUD and the wave controls follow its bottom edge (--board-bottom,
     set by fitBoard) in a strip the slot reserves, so height the board
     cannot use goes between them and the tray, and nothing moves the board. */
  #canvas-wrapper { flex: 1 1 0; }

  #tower-panel { flex: 0 0 auto; }

  #hud {
    position: relative;
    align-self: stretch;
    flex: 0 0 auto;
    padding: 6px 8px 6px;
    gap: 4px;
  }

  #board-slot { margin-bottom: 60px; }

  /* Docked just above the tower panel, below the board */
  #tower-stats-tooltip {
    width: auto;
    max-width: none;
    left: 8px !important;
    right: 8px;
    bottom: 6px;
  }

  /* One row under the board: phase line over the preview on the left,
     CANCEL and START WAVE on the right */
  #wave-controls {
    top: var(--board-bottom, auto);
    bottom: auto;
    left: 0;
    right: 0;
    transform: none;
    height: 60px;
    padding: 4px 10px;
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto auto;
    grid-template-rows: auto auto;
    align-content: center;
    align-items: center;
    gap: 2px 8px;
  }

  #phase-label { grid-column: 1; grid-row: 1; white-space: normal; line-height: 1.2; }
  #wave-progress,
  #wave-preview { grid-column: 1; grid-row: 2; justify-self: start; text-align: left; }
  #wave-preview { padding: 2px 8px; }
  #wave-controls #cancel-place-btn { grid-column: 2; grid-row: 1 / 3; }
  #start-wave-btn { grid-column: 3; grid-row: 1 / 3; }

  /* Fixed height, so the mid-wave note never changes the tray's height */
  #panel-head { justify-content: space-between; flex-wrap: nowrap; height: 20px; padding: 0 2px; }

  /* Height a full-width board cannot use (tall screens) goes to the tray:
     taller buttons, bigger pictures. 262px is the HUD, the wave controls and
     the tray at its base size; 133.34vw is the 9x12 board at full width. */
  #tower-panel {
    --tray-extra: clamp(0px, calc(100dvh - 133.34vw - 262px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)), 60px);
  }
  #tower-list .tower-btn { min-height: calc(60px + var(--tray-extra)); }
  .tower-btn .tower-pic { width: calc(32px + var(--tray-extra) / 2); height: calc(32px + var(--tray-extra) / 2); }

  /* Compact enough for two lines over the HUD, the only free strip above the board */
  #tutorial-overlay { padding: 6px 12px; font-size: 14px; line-height: 1.3; }
  #tutorial-overlay .tutorial-msg { margin-bottom: 2px; }
}

/* Desktop: a centred column with the HUD as wide as the board, the board,
   and the wave controls in one row under it (fitBoard sets --board-w and
   --board-bottom). The slot reserves the wave controls' strip, so nothing
   floats over the board and the phase never moves it. */
@media (min-width: 769px) and (min-height: 501px) {
  #hud {
    position: relative;
    flex: 0 0 auto;
    width: var(--board-w, 100%);
  }

  #board-slot { margin-bottom: 64px; }

  #wave-controls {
    top: var(--board-bottom, auto);
    bottom: auto;
    width: var(--board-w, 100%);
    height: 64px;
    flex-direction: row;
    justify-content: center;
    gap: 16px;
  }

  #tower-panel { width: 280px; }
  .tower-btn .tower-pic { width: 48px; height: 48px; }
}

/* Landscape phones: a left rail (HUD on top, wave controls at the bottom),
   the board, and the tray as a column on the right. Nothing covers the board. */
@media (max-height: 500px) {
  #game-container {
    flex-direction: row;
  }

  #canvas-wrapper {
    display: grid;
    grid-template-columns: minmax(150px, 190px) minmax(0, 1fr);
    grid-template-rows: auto minmax(0, 1fr);
  }

  #hud {
    position: relative;
    grid-column: 1;
    grid-row: 1;
    padding: 6px 8px;
    background: none;
  }

  #hud-row2 { flex-direction: column; align-items: stretch; }
  #unlock-tracker { flex: none; width: 50%; }
  /* Speed, pause and sound on one row of the rail */
  #speed-controls .speed-btn { flex: 1 1 auto; padding: 0 4px; font-size: 13px; }

  #board-slot { grid-column: 2; grid-row: 1 / 3; align-items: center; }

  #wave-controls {
    position: static;
    grid-column: 1;
    grid-row: 2;
    align-self: end;
    transform: none;
    padding: 6px 8px 8px;
    gap: 6px;
  }

  #phase-label { white-space: normal; text-align: center; }
  #wave-preview { white-space: normal; padding: 4px 8px; }

  /* The tutorial caption docks in the rail, beside the board */
  #tutorial-overlay { left: 6px; width: 178px; transform: none; padding: 8px 10px; font-size: 14px; line-height: 1.3; }

  #tower-panel {
    width: 112px;
    padding: 6px;
    border-top: none;
    border-left: 1px solid #1a1a2e;
    flex-direction: column;
    flex-wrap: nowrap;
  }

  #tower-panel h3 { font-size: 14px; }
  #panel-head { min-height: 36px; align-content: center; text-align: center; }

  #tower-list {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 6px;
  }

  .tower-btn { min-height: 44px; }

  /* The title is narrow enough here to clear the language toggle */
  #menu-screen { padding-top: calc(16px + env(safe-area-inset-top, 0px)); }

  /* Counters in a 2x2 block */
  #ui-overlay { grid-template-columns: repeat(2, 1fr); row-gap: 4px; font-size: 18px; }
  #start-wave-btn { padding: 8px 18px; font-size: 15px; }
}

/* Landscape phones: the tower card docks to the right edge, full height,
   over the tray column; the upgrade sheet docks to the right edge, or the
   left one with .sheet-left, away from the selected tower */
@media (max-height: 500px) and (pointer: coarse) {
  #upgrade-panel,
  #tower-stats-tooltip {
    position: fixed;
    left: auto !important;
    right: 0;
    top: 0 !important;
    bottom: 0;
    width: 320px;
    max-width: none;
    max-height: none !important;
    padding-right: calc(16px + env(safe-area-inset-right, 0px));
    padding-bottom: 14px;
    border: none;
    border-left: 1px solid rgba(0, 255, 255, 0.4);
    border-radius: 12px 0 0 12px;
  }

  #upgrade-panel.sheet-left {
    left: 0 !important;
    right: auto;
    padding: 14px 16px 14px calc(16px + env(safe-area-inset-left, 0px));
    border-left: none;
    border-right: 1px solid rgba(0, 255, 255, 0.4);
    border-radius: 0 12px 12px 0;
  }
  #upgrade-panel .up-close { right: calc(2px + env(safe-area-inset-right, 0px)); }
  #upgrade-panel.sheet-left .up-close { right: 2px; }
}

/* Touch devices: larger tap targets */
@media (pointer: coarse) {
  .speed-btn {
    min-width: 44px;
    min-height: 44px;
    padding: 10px 12px;
  }

  .tower-btn { min-height: 48px; }
  .menu-btn { min-height: 48px; padding: 12px 32px; }
  #start-wave-btn { min-height: 48px; }
  #cancel-place-btn { min-height: 44px; }
  #pause-overlay p { display: none; }
}

/* Challenge banner on menu */
#challenge-banner {
  background: rgba(255, 136, 0, 0.08);
  border: 1px solid rgba(255, 136, 0, 0.4);
  border-radius: 8px;
  padding: 10px 20px;
  margin-bottom: 12px;
  text-align: center;
  animation: challenge-pulse 2s ease-in-out infinite;
}
#challenge-banner .challenge-from {
  font-size: 11px;
  color: #ff8800;
  letter-spacing: 2px;
  margin-bottom: 4px;
}
#challenge-banner .challenge-name {
  font-size: 18px;
  color: #fff;
  font-weight: bold;
}
#challenge-banner .challenge-stats {
  font-size: 14px;
  color: #ffd700;
  margin-top: 4px;
}
@keyframes challenge-pulse {
  0%, 100% { border-color: rgba(255, 136, 0, 0.3); box-shadow: 0 0 8px rgba(255, 136, 0, 0.1); }
  50% { border-color: rgba(255, 136, 0, 0.7); box-shadow: 0 0 16px rgba(255, 136, 0, 0.25); }
}

/* Share toast */
#share-toast {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0, 255, 102, 0.15);
  border: 1px solid #00ff66;
  color: #00ff66;
  padding: 10px 24px;
  border-radius: 6px;
  font-family: 'Courier New', monospace;
  font-size: 14px;
  z-index: 200;
  transition: opacity 0.3s;
}
#share-toast.hidden { display: none; }

/* Challenge result on game over */
#challenge-result.beat { color: #00ff66; text-shadow: 0 0 10px rgba(0,255,102,0.5); }
#challenge-result.lost { color: #ff8800; text-shadow: 0 0 10px rgba(255,136,0,0.5); }

/* PWA install banner */
#pwa-banner {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(10, 10, 10, 0.95);
  border: 1px solid #00ffff;
  color: #ccc;
  padding: 12px 40px 12px 16px;
  border-radius: 8px;
  font-family: 'Courier New', monospace;
  font-size: 13px;
  z-index: 300;
  max-width: 90vw;
  text-align: center;
  box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
  animation: pwa-slide-up 0.4s ease-out;
}
#pwa-banner.hidden { display: none; }
#pwa-banner-close {
  position: absolute;
  top: 6px;
  right: 10px;
  background: none;
  border: none;
  color: #666;
  font-size: 20px;
  cursor: pointer;
  font-family: 'Courier New', monospace;
}
@keyframes pwa-slide-up {
  from { transform: translateX(-50%) translateY(100%); opacity: 0; }
  to { transform: translateX(-50%) translateY(0); opacity: 1; }
}
</style>
</head>
<body>

<div id="game-container">
  <div id="canvas-wrapper">
    <div id="hud">
      <div id="ui-overlay">
        <div id="hud-gold" class="hud-item"><span id="gold-value">100</span></div>
        <div id="hud-wave" class="hud-item"><span id="wave-value">0</span></div>
        <div id="hud-lives" class="hud-item"><span id="lives-value">20</span></div>
        <div id="hud-score" class="hud-item"><span id="score-value">0</span></div>
      </div>
      <div id="hud-row2">
        <div id="unlock-tracker" class="hidden"></div>
        <div id="speed-controls">
          <button class="speed-btn" id="speed-btn">1x</button>
          <button class="speed-btn" id="pause-btn"></button>
          <button class="speed-btn" id="mute-btn"></button>
        </div>
      </div>
    </div>

    <div id="board-slot"><canvas id="game-canvas"></canvas></div>

    <div id="wave-controls">
      <div id="phase-label"></div>
      <div id="wave-progress"></div>
      <div id="wave-preview">Next: <span id="wave-preview-content"></span></div>
      <button id="start-wave-btn">START WAVE</button>
    </div>
    <button id="cancel-place-btn" class="hidden">CANCEL</button>
    <div id="tutorial-overlay" class="hidden"></div>
    <div class="tutorial-blocker hidden"></div>
    <div class="tutorial-blocker hidden"></div>
    <div class="tutorial-blocker hidden"></div>
    <div class="tutorial-blocker hidden"></div>
    <div id="tutorial-pointer" class="hidden">
      <svg viewBox="0 0 24 24" width="44" height="44" aria-hidden="true"><path fill="currentColor" stroke="#003" stroke-width="0.8" d="M9 2.5a1.6 1.6 0 0 1 3.2 0V10l.1-.1a1.6 1.6 0 0 1 3 .6v.3a1.6 1.6 0 0 1 3 .7v.6a1.6 1.6 0 0 1 3 .8V17c0 3-2.4 5.5-5.4 5.5h-2.3c-1.8 0-3.4-.9-4.4-2.4L4.6 15a1.6 1.6 0 0 1 2.4-2l2 1.8z"/></svg>
    </div>
    <div id="upgrade-panel"></div>
    <div id="tower-stats-tooltip"></div>

    <div id="menu-screen">
      <div id="lang-select">
        <button class="lang-btn active" data-lang="en">EN</button>
        <button class="lang-btn" data-lang="it">IT</button>
      </div>
      <h1>NEON DEFENSE</h1>
      <div id="challenge-banner" class="hidden"></div>
      <div id="difficulty-label">SELECT DIFFICULTY</div>
      <div id="difficulty-buttons">
        <button class="menu-btn difficulty-btn" data-difficulty="easy">LONG PATH</button>
        <button class="menu-btn difficulty-btn" data-difficulty="normal">MEDIUM PATH</button>
        <button class="menu-btn difficulty-btn" data-difficulty="hard">SHORT PATH</button>
      </div>
      <button class="menu-btn" id="high-scores-btn">GLOBAL SCORES</button>
      <div id="high-scores-list"></div>
      <!-- Inside the menu, so the install banner never shows over the game -->
      <div id="pwa-banner" class="hidden">
        <span id="pwa-banner-text"></span>
        <button id="pwa-banner-close">&times;</button>
      </div>
    </div>

    <div id="pause-overlay">
      <h2>PAUSED</h2>
      <p>Press SPACE or ESC to resume</p>
      <button class="menu-btn" id="resume-btn" style="margin-top: 16px;">RESUME</button>
      <button class="menu-btn" id="replay-tutorial-btn" style="margin-top: 8px;">REPLAY TUTORIAL</button>
      <button class="menu-btn" id="restart-btn" style="margin-top: 8px;">RESTART</button>
    </div>

    <div id="game-over-screen">
      <h2>GAME OVER</h2>
      <p>Score: <span id="final-score">0</span></p>
      <p>Wave: <span id="final-wave">0</span></p>
      <p id="cores-earned" style="color: #c77dff;"></p>
      <p id="next-unlock-hint" style="display:none; font-size: 13px; color: #aaa;"></p>
      <input id="player-name" placeholder="Enter name" maxlength="12" autocomplete="off">
      <p id="name-taken-warn" style="visibility:hidden; color:#ff6666; font-size:12px; margin:4px 0 0;">&nbsp;</p>
      <p id="challenge-result" style="display:none; font-size: 16px; font-weight: bold; margin: 6px 0;"></p>
      <button class="menu-btn" id="save-score-btn">SAVE SCORE</button>
      <button class="menu-btn" id="share-score-btn" style="background: rgba(0,255,102,0.12); border-color: #00ff66; color: #00ff66;">CHALLENGE A FRIEND</button>
      <button class="menu-btn" id="play-again-btn">PLAY AGAIN</button>
    </div>
  </div>

  <div id="tower-panel" class="panel-hidden">
    <div id="panel-head">
      <h3>TOWERS</h3>
      <div id="build-note"></div>
    </div>
    <div id="tower-list"></div>
  </div>

  <div id="share-toast" class="hidden">Link copied!</div>

</div>

<script type="module" src="js/main.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js');
    });
  }
  // PWA install prompt
  (function() {
    const isStandalone = window.matchMedia('(display-mode: standalone)').matches
      || window.navigator.standalone === true;
    if (isStandalone) return;
    if (localStorage.getItem('neon_td_pwa_dismissed')) return;

    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
    const isAndroid = /Android/.test(navigator.userAgent);
    if (!isIOS && !isAndroid) return;

    let deferredPrompt = null;

    function getIsIT() {
      const lang = localStorage.getItem('neon_td_lang') || (navigator.language || '').slice(0, 2);
      return lang === 'it';
    }

    function showBanner(text) {
      const banner = document.getElementById('pwa-banner');
      document.getElementById('pwa-banner-text').innerHTML = text;
      banner.classList.remove('hidden');
      document.getElementById('pwa-banner-close').addEventListener('click', () => {
        banner.classList.add('hidden');
        localStorage.setItem('neon_td_pwa_dismissed', '1');
      });
    }

    if (isIOS) {
      setTimeout(() => {
        const text = getIsIT()
          ? 'Installa come app: tocca <strong style="color:#00ffff">Condividi</strong> poi <strong style="color:#00ffff">Aggiungi alla Home</strong>'
          : 'Install as app: tap <strong style="color:#00ffff">Share</strong> then <strong style="color:#00ffff">Add to Home Screen</strong>';
        showBanner(text);
      }, 2000);
    } else {
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        setTimeout(() => {
          const text = getIsIT()
            ? 'Installa come app per la migliore esperienza! <strong style="color:#00ffff;cursor:pointer" id="pwa-install-btn">INSTALLA</strong>'
            : 'Install as app for the best experience! <strong style="color:#00ffff;cursor:pointer" id="pwa-install-btn">INSTALL</strong>';
          showBanner(text);
          document.getElementById('pwa-install-btn')?.addEventListener('click', () => {
            deferredPrompt.prompt();
            document.getElementById('pwa-banner').classList.add('hidden');
            localStorage.setItem('neon_td_pwa_dismissed', '1');
          });
        }, 2000);
      });
    }
  })();

  // Touch feedback for menu buttons (CSS :active is unreliable on iOS)
  document.addEventListener('touchstart', (e) => {
    const btn = e.target.closest('.menu-btn');
    if (btn) btn.classList.add('touching');
  }, { passive: true });
  ['touchend', 'touchcancel'].forEach((ev) => {
    document.addEventListener(ev, (e) => {
      const btn = e.target.closest('.menu-btn');
      if (btn) btn.classList.remove('touching');
    }, { passive: true });
  });
</script>
</body>
</html>
